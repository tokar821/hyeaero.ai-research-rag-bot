[pytest]
markers =
    smoke: Tier 0 critical routing smoke (<30s target)
    merge_gate: Tier 1 pre-merge deterministic gate (<2min target)
    deterministic: Tier 2 full deterministic nightly suite
    stress: Tier 3 stress/replay/adversarial (orthogonal to merge gate)
    slow: Deprecated alias — use stress instead
    non_certification: Observability or legacy suite — not a Phase 53/54 certification KPI

filterwarnings =
    ignore::DeprecationWarning
