# Phase 31 — Tier 0 Smoke Gate
# Target: <30 seconds
# Command (from backend/):
#   pytest -m smoke -q

[gate]
marker = smoke
description = Tier 0 critical routing smoke
target_runtime = 30s

[paths]
tests =
    tests/test_semantic_intent_lock_engine.py
    tests/test_phase15_fail_closed.py
    tests/test_deterministic_execution_guard.py
    tests/test_authority_dispatch.py
    tests/test_intent_conflict_resolution.py
    tests/test_intent_execution_trace.py

[command]
run = pytest -m smoke tests/test_semantic_intent_lock_engine.py tests/test_phase15_fail_closed.py tests/test_deterministic_execution_guard.py tests/test_authority_dispatch.py tests/test_intent_conflict_resolution.py tests/test_intent_execution_trace.py -q
