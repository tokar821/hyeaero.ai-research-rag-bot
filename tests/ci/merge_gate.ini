# Phase 31 — Tier 1 Merge Gate
# Target: <2 minutes
# Includes: IntentLock, Dispatch, Guard, AKAL, ICRL, Budget, replay hash (unit-level)
# Excludes: E2E retrieval, 100x replay, adversarial matrices, full pipeline reproduction
# Command (from backend/):
#   pytest -m merge_gate -q

[gate]
marker = merge_gate
description = Tier 1 pre-merge deterministic gate
target_runtime = 120s
excludes = e2e retrieval, 100x replay, adversarial, pipeline reproduction

[paths]
tests =
    tests/test_semantic_intent_lock_engine.py
    tests/test_phase15_fail_closed.py
    tests/test_deterministic_execution_guard.py
    tests/test_authority_dispatch.py
    tests/test_intent_conflict_resolution.py
    tests/test_intent_execution_trace.py
    tests/test_aircraft_authority_service.py
    tests/integration/test_intent_lock_guard_integration.py
    tests/routing/test_budget_constraint_matrix.py
    tests/akal/test_akal_truth_matrix.py
    tests/test_execution_replay_engine.py
    tests/fail_closed/test_fail_closed_matrix.py
    tests/replay/test_replay_determinism_v2.py

[command]
run = pytest -m merge_gate tests/test_semantic_intent_lock_engine.py tests/test_phase15_fail_closed.py tests/test_deterministic_execution_guard.py tests/test_authority_dispatch.py tests/test_intent_conflict_resolution.py tests/test_intent_execution_trace.py tests/test_aircraft_authority_service.py tests/integration/test_intent_lock_guard_integration.py tests/routing/test_budget_constraint_matrix.py tests/akal/test_akal_truth_matrix.py tests/test_execution_replay_engine.py tests/fail_closed/test_fail_closed_matrix.py tests/replay/test_replay_determinism_v2.py -q
