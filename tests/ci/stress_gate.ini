# Phase 31 — Tier 3 Stress Gate
# Target: 100x replay, adversarial fuzzing, heavy E2E matrices
# Command (from backend/):
#   pytest -m stress -q

[gate]
marker = stress
description = Tier 3 stress / replay / adversarial
includes = 100x replay loops, adversarial routing, full E2E retrieval, pipeline reproduction

[paths]
tests =
    tests/routing/test_adversarial_routing.py
    tests/e2e/test_consultant_retrieval_intent_lock_e2e.py
    tests/replay/test_pipeline_reproducibility.py
    tests/replay/test_replay_determinism_v2.py

[command]
run = pytest -m stress tests/routing/test_adversarial_routing.py tests/e2e/test_consultant_retrieval_intent_lock_e2e.py tests/replay/test_pipeline_reproducibility.py tests/replay/test_replay_determinism_v2.py -q
